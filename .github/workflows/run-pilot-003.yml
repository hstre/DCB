name: Run DCB PILOT_003 seed

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Frozen PILOT_003 seed ID"
        required: true
        default: "P003-001"
        type: choice
        options:
          - P003-001
          - P003-002
          - P003-003
          - P003-004
          - P003-005
          - P003-006
          - P003-007
          - P003-008
          - P003-009
          - P003-010
          - P003-011
          - P003-012
          - P003-013
          - P003-014
          - P003-015
          - P003-016
          - P003-017
          - P003-018
          - P003-019
          - P003-020
      attempt:
        description: "Immutable attempt number (normally 1)"
        required: true
        default: "1"
        type: string

permissions:
  contents: write

concurrency:
  group: dcb-pilot-003
  cancel-in-progress: false

jobs:
  run-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DCB_API_KEY: ${{ secrets.DCB_API_KEY }}
      DCB_MODEL: deepseek-v4-pro
      DCB_MODEL_VERSION: DeepSeek-V4-Pro-0813
      DCB_API_BASE: https://api.deepseek.com
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Verify frozen components compile
        run: |
          set -euo pipefail
          python -m py_compile runner/run_pilot_003.py
          python -m py_compile analysis/pilot_003_analysis.py
          test -f preregistration/PILOT_003.md
          test -f protocol/PILOT_003_PROVENANCE.md
          test -f prompts/PILOT_003_TEMPLATES.md
          test -f prompts/seed_map_pilot_003.json
          test -f scoring/schema_pilot_003.json
          test -f protocol/FREEZE_PILOT_003.md

      - name: Validate attempt input and refuse overwrite
        shell: bash
        run: |
          set -euo pipefail
          ATTEMPT="${{ inputs.attempt }}"
          [[ "$ATTEMPT" =~ ^[1-9][0-9]*$ ]] || { echo "attempt must be a positive integer"; exit 1; }
          PADDED=$(printf "%02d" "$ATTEMPT")
          FILE="trajectories/raw/${{ inputs.seed }}.attempt-${PADDED}.json"
          test ! -e "$FILE" || { echo "Attempt record already exists; refusing overwrite."; exit 1; }
          if [ "$ATTEMPT" -gt 1 ]; then
            test -e "trajectories/raw/${{ inputs.seed }}.attempt-01.json" || {
              echo "Later attempts require an existing first attempt."; exit 1;
            }
          fi

      - name: Execute frozen seed
        shell: bash
        run: |
          set -euo pipefail
          python runner/run_pilot_003.py --seed "${{ inputs.seed }}" --attempt "${{ inputs.attempt }}"

      - name: Validate raw record against frozen schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema
          seed = "${{ inputs.seed }}"
          attempt = int("${{ inputs.attempt }}")
          path = Path("trajectories/raw") / f"{seed}.attempt-{attempt:02d}.json"
          record = json.loads(path.read_text(encoding="utf-8"))
          schema = json.loads(Path("scoring/schema_pilot_003.json").read_text(encoding="utf-8"))
          jsonschema.validate(record, schema)
          assert record["seed_id"] == seed
          assert record["attempt"] == attempt
          assert record["model"] == "deepseek-v4-pro"
          assert record["model_version"] == "DeepSeek-V4-Pro-0813"
          assert record["interface_level"] == "I1_SIM"
          assert record["s1_status"] == "NOT_TESTABLE"
          assert record["request_parameters"]["thinking"] == {"type": "disabled"}
          print(json.dumps({
              "seed_id": seed,
              "attempt": attempt,
              "excluded": record["excluded"],
              "exclusion_code": record["exclusion_code"],
              "phase2_restart_count": record.get("phase2_restart_count"),
              "tool_calls_logged": len(record.get("tool_integrity", [])),
          }, indent=2))
          PY

      - name: Preserve raw attempt as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dcb-${{ inputs.seed }}-attempt-${{ inputs.attempt }}-raw
          path: trajectories/raw/${{ inputs.seed }}.attempt-*.json
          if-no-files-found: error
          retention-days: 90

      - name: Commit append-only raw attempt
        shell: bash
        run: |
          set -euo pipefail
          ATTEMPT="${{ inputs.attempt }}"
          PADDED=$(printf "%02d" "$ATTEMPT")
          FILE="trajectories/raw/${{ inputs.seed }}.attempt-${PADDED}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$FILE"
          git diff --cached --exit-code && { echo "No raw attempt change to commit."; exit 1; }
          git commit -m "Record PILOT_003 ${{ inputs.seed }} attempt ${ATTEMPT}"
          git push origin HEAD:main
