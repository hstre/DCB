name: Run DCB PILOT_003 seeds (batch)

# Orchestration only. This workflow does not define PILOT_003: it executes the frozen
# runner/run_pilot_003.py under the same pinned model, provider and request mode as
# .github/workflows/run-pilot-003.yml, which is left byte-identical.
#
# PILOT_003 attempts are append-only and not rescuable by reruns, so this workflow runs
# attempt 1 only, never deletes a written record, and never retries a seed. A seed whose
# execution fails is recorded by the runner as an excluded attempt and committed as data.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Frozen PILOT_003 seed ID, or ALL_REMAINING for every seed without a first attempt"
        required: true
        default: "ALL_REMAINING"
        type: choice
        options:
          - ALL_REMAINING
          - P003-001
          - P003-002
          - P003-003
          - P003-004
          - P003-005
          - P003-006
          - P003-007
          - P003-008
          - P003-009
          - P003-010
          - P003-011
          - P003-012
          - P003-013
          - P003-014
          - P003-015
          - P003-016
          - P003-017
          - P003-018
          - P003-019
          - P003-020

permissions:
  contents: write

concurrency:
  group: dcb-pilot-003
  cancel-in-progress: false

jobs:
  run-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DCB_API_KEY: ${{ secrets.DCB_API_KEY }}
      DCB_MODEL: deepseek-v4-pro
      DCB_MODEL_VERSION: DeepSeek-V4-Pro-0813
      DCB_API_BASE: https://api.deepseek.com
      PYTHONUNBUFFERED: "1"
      SEED_INPUT: ${{ inputs.seed }}
      TARGET_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Record execution metadata
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DCB_API_KEY}"
          echo "pilot=PILOT_003"
          echo "seed_input=${SEED_INPUT}"
          echo "model=${DCB_MODEL}"
          echo "declared_provider_version=${DCB_MODEL_VERSION}"
          echo "api_base=${DCB_API_BASE}"
          echo "source_commit=${GITHUB_SHA}"
          echo "target_branch=${TARGET_BRANCH}"
          python --version

      - name: Verify the frozen PILOT_003 manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          rows = re.findall(
              r"^\|\s*`([^`]+)`\s*\|\s*`([0-9a-f]{40})`\s*\|",
              Path("protocol/FREEZE_PILOT_003.md").read_text(encoding="utf-8"),
              re.M,
          )
          if len(rows) != 8:
              raise SystemExit(f"expected 8 frozen manifest entries, found {len(rows)}")
          bad = []
          for path, sha in rows:
              actual = subprocess.run(["git", "hash-object", path], capture_output=True, text=True, check=True).stdout.strip()
              print(("OK      " if actual == sha else "MISMATCH") + " " + path)
              if actual != sha:
                  bad.append(path)
          if bad:
              raise SystemExit("frozen PILOT_003 components differ from the freeze manifest: " + ", ".join(bad))
          PY

      - name: Verify frozen components compile
        run: |
          set -euo pipefail
          python -m py_compile runner/run_pilot_003.py
          python -m py_compile analysis/pilot_003_analysis.py
          test -f preregistration/PILOT_003.md
          test -f protocol/PILOT_003_PROVENANCE.md
          test -f prompts/PILOT_003_TEMPLATES.md
          test -f prompts/seed_map_pilot_003.json
          test -f scoring/schema_pilot_003.json
          test -f protocol/FREEZE_PILOT_003.md

      - name: Resolve seed list
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > seeds_to_run.txt
          import os
          from pathlib import Path

          seed_input = os.environ["SEED_INPUT"]
          ids = [f"P003-{i:03d}" for i in range(1, 21)]

          def has_first_attempt(seed):
              return Path(f"trajectories/raw/{seed}.attempt-01.json").exists()

          if seed_input == "ALL_REMAINING":
              todo = [s for s in ids if not has_first_attempt(s)]
          else:
              if seed_input not in ids:
                  raise SystemExit(f"Unknown seed: {seed_input}")
              if has_first_attempt(seed_input):
                  raise SystemExit("First attempt already recorded; refusing overwrite.")
              todo = [seed_input]

          if not todo:
              raise SystemExit("No seed without a first attempt; nothing to execute.")
          print("\n".join(todo))
          PY
          echo "Seeds to execute:"
          cat seeds_to_run.txt

      - name: Execute seeds and commit each raw attempt
        shell: bash
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_file() {
            local file="$1" seed="$2"
            git add -- "$file"
            git commit -m "Record PILOT_003 ${seed} attempt 1"
            for delay in 2 4 8 16 0; do
              git push origin "HEAD:${TARGET_BRANCH}" && return 0
              [ "${delay}" -eq 0 ] && break
              sleep "${delay}"
            done
            echo "::error::push failed for ${seed}"
            return 1
          }

          status=0
          while read -r seed; do
            [ -n "${seed}" ] || continue
            FILE="trajectories/raw/${seed}.attempt-01.json"
            if [ -e "${FILE}" ]; then
              echo "::notice::${seed} already has a first attempt; skipping."
              continue
            fi
            echo "::group::${seed}"
            python runner/run_pilot_003.py --seed "${seed}" --attempt 1 || true
            if [ ! -e "${FILE}" ]; then
              echo "::error::${seed} produced no attempt record; stopping."
              echo "::endgroup::"
              status=1
              break
            fi
            # The record is target data whether or not the attempt was excluded: commit it
            # before validating, so nothing that reached the provider is ever discarded.
            push_file "${FILE}" "${seed}" || { echo "::endgroup::"; status=1; break; }
            if ! SEED_ID="${seed}" python - <<'PY'
          import json, os
          from pathlib import Path
          import jsonschema
          seed = os.environ["SEED_ID"]
          path = Path("trajectories/raw") / f"{seed}.attempt-01.json"
          record = json.loads(path.read_text(encoding="utf-8"))
          schema = json.loads(Path("scoring/schema_pilot_003.json").read_text(encoding="utf-8"))
          jsonschema.validate(record, schema)
          assert record["seed_id"] == seed
          assert record["attempt"] == 1
          assert record["model"] == "deepseek-v4-pro"
          assert record["model_version"] == "DeepSeek-V4-Pro-0813"
          assert record["interface_level"] == "I1_SIM"
          assert record["s1_status"] == "NOT_TESTABLE"
          assert record["request_parameters"]["thinking"] == {"type": "disabled"}
          print(json.dumps({
              "seed_id": seed,
              "excluded": record["excluded"],
              "exclusion_code": record["exclusion_code"],
              "phase2_restart_count": record.get("phase2_restart_count"),
              "tool_calls_logged": len(record.get("tool_integrity", [])),
          }, indent=2))
          PY
            then
              echo "::error::${seed} attempt record failed schema validation; committed as-is, stopping."
              echo "::endgroup::"
              status=1
              break
            fi
            echo "::endgroup::"
          done < seeds_to_run.txt
          exit "${status}"

      - name: Summarize pilot coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee -a "${GITHUB_STEP_SUMMARY}"
          import json
          from pathlib import Path
          ids = [f"P003-{i:03d}" for i in range(1, 21)]
          done, missing, excluded, restarts = [], [], [], 0
          for s in ids:
              p = Path("trajectories/raw") / f"{s}.attempt-01.json"
              if not p.exists():
                  missing.append(s)
                  continue
              done.append(s)
              d = json.loads(p.read_text(encoding="utf-8"))
              restarts += d.get("phase2_restart_count") or 0
              if d.get("excluded"):
                  excluded.append(f"{s} ({d.get('exclusion_code')})")
          print("## PILOT_003 first-attempt coverage\n")
          print(f"- recorded: {len(done)}/{len(ids)}")
          print(f"- excluded attempts: {', '.join(excluded) or 'none'}")
          print(f"- phase-2 restarts: {restarts}")
          print(f"- missing: {', '.join(missing) or 'none'}")
          PY

      - name: Preserve raw attempts as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcb-pilot-003-raw-${{ github.run_id }}
          path: trajectories/raw/P003-*.json
          if-no-files-found: error
          retention-days: 90
