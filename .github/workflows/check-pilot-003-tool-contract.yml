name: Check DCB PILOT_003 tool contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-pilot-003-tool-contract.yml

permissions:
  contents: read

jobs:
  frozen-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DCB_API_KEY: ${{ secrets.DCB_API_KEY }}
      DCB_MODEL: deepseek-v4-pro
      DCB_MODEL_VERSION: DeepSeek-V4-Pro-0813
      DCB_API_BASE: https://api.deepseek.com
      P003_CONTRACT_REVISION: final-frozen-v1
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install schema validator
        run: python -m pip install --disable-pip-version-check jsonschema

      - name: Compile frozen code
        run: |
          python -m py_compile runner/run_pilot_003.py
          python -m py_compile analysis/pilot_003_analysis.py
          python -m py_compile tests/pilot_003_prefreeze_check.py
          python -m py_compile tests/pilot_003_provider_contract_check.py

      - name: Run final offline mechanical checks
        run: python tests/pilot_003_prefreeze_check.py

      - name: Run live non-target DeepSeek tool contract check
        run: |
          test -n "${DCB_API_KEY}"
          python tests/pilot_003_provider_contract_check.py
